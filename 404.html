<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — rstappdev</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#f6f3ee;--ink:#14120f;--ink-soft:#3c3833;--muted:#6f6a62;--rule:#ded6c9;--accent:#b6471f;
        --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font-family:var(--sans);padding:2rem}
  .box{max-width:34rem}
  p.code{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15;margin:0 0 1rem;letter-spacing:-.01em}
  p.lede{color:var(--ink-soft);margin:0 0 1.75rem;line-height:1.6}
  a{display:inline-flex;align-items:center;min-height:44px;padding:.7rem 1.15rem;border-radius:3px;
    background:var(--ink);color:var(--paper);text-decoration:none;font-size:.95rem;border:1px solid var(--ink)}
  a:hover{background:var(--accent);border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>That page isn&rsquo;t here.</h1>
    <p class="lede">The link may be old, or the address slightly off. Everything rstappdev does lives on the one page.</p>
    <a href="/">Back to rstappdev</a>
  </div>
</body>
</html>
